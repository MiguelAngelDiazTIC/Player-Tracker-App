name: Publicar versión

# Al subir una etiqueta como v1.0.0, compila el instalador y crea la Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Instalador y Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: La etiqueta coincide con la versión de package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta es $GITHUB_REF_NAME y package.json dice $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run tauri build

      - name: Crear la Release con el instalador
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            src-tauri/target/release/bundle/nsis/*.exe \
            --title "MikaLog ${GITHUB_REF_NAME#v}" \
            --generate-notes
