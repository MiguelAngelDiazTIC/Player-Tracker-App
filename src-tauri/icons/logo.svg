<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Logo de MikaLog. Archivo maestro: los PNG, icon.ico e icon.icns se
       generan con `npx tauri icon src-tauri/icons/logo.svg`. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A4CB" />
      <stop offset="1" stop-color="#D8F5BC" />
    </linearGradient>
  </defs>

  <!-- El degradado del fondo de la app, en un cuadrado de esquinas redondeadas. -->
  <rect width="1024" height="1024" rx="232" fill="url(#fondo)" />

  <!-- La mira: cuatro marcas y un disco blanco, como el cristal de la app. -->
  <g stroke="#FFFFFF" stroke-width="84" stroke-linecap="round">
    <line x1="512" y1="112" x2="512" y2="232" />
    <line x1="512" y1="792" x2="512" y2="912" />
    <line x1="112" y1="512" x2="232" y2="512" />
    <line x1="792" y1="512" x2="912" y2="512" />
  </g>
  <circle cx="512" cy="512" r="304" fill="#FFFFFF" />
  <circle cx="512" cy="512" r="262" fill="none" stroke="#0A8158" stroke-width="44" />

  <!-- El centro de la mira es un check: apuntar y cumplir. -->
  <path
    d="M 396 520 L 480 604 L 636 432"
    fill="none"
    stroke="#0A8158"
    stroke-width="88"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
